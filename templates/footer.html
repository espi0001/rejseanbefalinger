<!--
  FOOTER.HTML
  inkluderes via layout.html
  Består af 3 kolonner (brand/om, links, hjælp) + copyright-linje.
-->
<footer class="site-footer">
  <div class="wrap site-footer__grid">
    
    <!-- Kolonne 1: Logo, kort beskrivelse og sprogskifter -->
    <div class="site-footer__brand">
      <a class="logo logo--light" href="{{ url_for('index') }}">{{ t('site_name') }}</a>
      <p>{{ t('footer_about') }}</p>

      <!--
          Sprogskifter: linker til den nuværende URL men med det andet sprog (other_lang). 
          "lang" og "other_lang" kommer sikkert fra en context processor i Flask, så de er tilgængelige på alle sider.
      -->
      <a class="lang-switch lang-switch--footer" href="{{ url_for('set_lang', lang_code=other_lang) }}">
        {{ lang | upper }} / {{ other_lang | upper }}
      </a>
    </div>

    <!-- Kolonne 2: Links til "virksomheden" (forside + destinationer) -->
    <div>
      <h4>{{ t('footer_company') }}</h4>
      <ul class="footer-links">
        <li><a href="{{ url_for('index') }}">{{ t('nav_home') }}</a></li>
        <li><a href="{{ url_for('index') }}#destinations">{{ t('nav_destinations') }}</a></li>
      </ul>
    </div>

    <!-- Kolonne 3: Hjælpe-links (kontakt/FAQ) - pt. bare "#" pladsholdere -->
    <div>
      <h4>{{ t('footer_help') }}</h4>
      <ul class="footer-links">
        <li><a href="#">{{ t('footer_contact') }}</a></li>
        <li><a href="#">{{ t('footer_faq') }}</a></li>
      </ul>
    </div>
  </div>

  <!-- Bundlinje med copyright-tekst -->
  <div class="wrap site-footer__bottom">
    <p>{{ t('footer_copyright') }}</p>
  </div>
</footer>
