<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="logo" href="{{ url_for('index') }}">{{ t('site_name') }}</a>

    <nav class="site-nav" aria-label="Main">
      <a href="{{ url_for('index') }}">{{ t('nav_home') }}</a>
      <a href="{{ url_for('index') }}#destinations">{{ t('nav_destinations') }}</a>
    </nav>

    <div class="header-actions">
      <a class="lang-switch" href="{{ url_for('set_lang', lang_code=other_lang) }}" aria-label="{{ t('language') }}">
        {{ lang | upper }} / {{ other_lang | upper }}
      </a>
    </div>
  </div>
</header>
