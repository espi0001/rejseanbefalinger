
<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{% block title %}{{ t('site_name') }}{% endblock %}</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  {# Grundskabelon: alle sider arver denne og udfylder hero/content-blokkene #}
  {% include "navbar.html" %}

  {% block hero %}{% endblock %}

  <main class="main">
    {% block content %}{% endblock %}
  </main>

  {% include "footer.html" %}

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
